name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Not a real secret — the app refuses to start without a 32+ char value,
      # and nothing in lint/type-check/tests touches the database.
      SESSION_SECRET: ci-placeholder-secret-value-32-chars-min
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx next build
